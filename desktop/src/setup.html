<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:" />
    <title>EditcoRAG</title>
    <style>
      :root {
        --bg: #f7f8fa; --surface: #fff; --line: #dfe4ea;
        --text: #10151c; --text-2: #4a5464; --text-3: #79839a;
        --accent: #3b6cf6; --accent-fg: #fff; --warn: #b26a00; --danger: #c8342b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0e14; --surface: #121722; --line: #232c3d;
          --text: #e8ecf4; --text-2: #a3adbf; --text-3: #6b7688;
          --accent: #5b8dff; --accent-fg: #0b0e14; --warn: #f0b429; --danger: #ff6b60;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; height: 100vh; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px; padding: 36px;
        background: var(--bg); color: var(--text); text-align: center;
        font-family: ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased; user-select: none;
      }
      h1 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
      p { margin: 0; font-size: 13.5px; line-height: 1.55; color: var(--text-2); max-width: 46ch; }
      .muted { color: var(--text-3); font-size: 12px; }
      .spinner {
        width: 30px; height: 30px; border-radius: 50%;
        border: 2.5px solid var(--line); border-top-color: var(--accent);
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .bar { width: 340px; height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
      .bar > div { height: 100%; width: 0%; background: var(--accent); border-radius: 999px; transition: width .4s ease; }
      .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
      button {
        font: inherit; font-size: 13px; padding: 8px 16px; border-radius: 8px;
        border: 1px solid var(--line); background: var(--surface); color: var(--text);
        cursor: pointer;
      }
      button.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
      button:hover { filter: brightness(1.08); }
      code {
        display: inline-block; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12.5px; background: var(--surface); border: 1px solid var(--line);
        padding: 7px 11px; border-radius: 7px; user-select: all; color: var(--text);
      }
      pre {
        max-width: 100%; max-height: 150px; overflow: auto; text-align: left;
        font-size: 11px; line-height: 1.45; background: var(--surface);
        border: 1px solid var(--line); border-radius: 8px; padding: 10px;
        color: var(--text-3); user-select: text; white-space: pre-wrap;
      }
      input {
        width: 340px; font: inherit; font-size: 13px; padding: 9px 12px;
        border-radius: 8px; border: 1px solid var(--line);
        background: var(--surface); color: var(--text); text-align: center;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        user-select: text;
      }
      input:focus { outline: none; border-color: var(--accent); }
      .hidden { display: none !important; }
    </style>
  </head>

    <div id="spinner" class="spinner"></div>
    <h1 id="title">Starting EditcoRAG</h1>
    <p id="detail">Getting things ready…</p>

    <div id="progress" class="hidden">
      <div class="bar"><div id="fill"></div></div>
      <p class="muted" id="pct" style="margin-top:9px">0%</p>
    </div>

    <div id="hint" class="hidden">
      <p class="muted">This happens once. You can leave it running.</p>
    </div>

    <div id="keyrow" class="hidden">
      <input id="key" type="password" spellcheck="false" autocomplete="off"
             placeholder="gsk_…" aria-label="Groq API key" />
    </div>

    <div id="actions" class="row hidden"></div>
    <pre id="logs" class="hidden"></pre>

    <script>
      const $ = (id) => document.getElementById(id);
      const show = (el, on) => el.classList.toggle("hidden", !on);

      function setActions(buttons) {
        const box = $("actions");
        box.innerHTML = "";
        buttons.forEach(({ label, primary, onClick }) => {
          const b = document.createElement("button");
          b.textContent = label;
          if (primary) b.className = "primary";
          b.onclick = onClick;
          box.appendChild(b);
        });
        show(box, buttons.length > 0);
      }

      const LLM_HELP = {
        no_key: {
          title: "One quick step",
          body: "EditcoRAG writes answers using Groq. Paste a Groq API key below — it’s free to create and is stored only on this computer.",
          needsKey: true,
        },
        bad_key: {
          title: "That key wasn’t accepted",
          body: "Groq rejected the key. Check it was copied in full, then try again.",
          needsKey: true,
        },
        offline: {
          title: "No connection to Groq",
          body: "EditcoRAG couldn’t reach Groq. Check this computer’s internet connection, then choose Try again.",
          needsKey: false,
        },
        model_missing: {
          title: "That model isn’t available",
          body: "Groq doesn’t currently serve the configured model. You can continue — answering will not work until it is changed.",
          needsKey: false,
        },
        unknown: {
          title: "Couldn’t check the answering model",
          body: "EditcoRAG could not verify Groq. You can continue and try asking a question.",
          needsKey: false,
        },
      };

      window.shellApi.onStatus((s) => {
        show($("progress"), s.phase === "downloading");
        show($("hint"), s.phase === "downloading");
        show($("spinner"), s.phase === "starting" || s.phase === "downloading");
        show($("logs"), false);
        show($("keyrow"), false);
        setActions([]);

        if (s.phase === "starting") {
          $("title").textContent = "Starting EditcoRAG";
          $("detail").textContent = s.detail || "";
        } else if (s.phase === "downloading") {
          $("title").textContent = "Setting up";
          $("detail").textContent = s.detail || "Downloading language models";
          $("fill").style.width = (s.percent || 0) + "%";
          $("pct").textContent = Math.round(s.percent || 0) + "%";
        } else if (s.phase === "llm") {
          const help = LLM_HELP[s.llm?.status] || LLM_HELP.unknown;
          $("title").textContent = help.title;
          $("detail").textContent = help.body;
          show($("keyrow"), help.needsKey);

          if (help.needsKey) {
            const field = $("key");
            const submit = async () => {
              const value = field.value.trim();
              if (!value) return;
              $("detail").textContent = "Checking the key…";
              setActions([]);
              await window.shellApi.submitKey(value);
            };
            field.onkeydown = (e) => {
              if (e.key === "Enter") submit();
            };
            setTimeout(() => field.focus(), 50);
            setActions([
              { label: "Continue", primary: true, onClick: submit },
              { label: "Get a free key", onClick: () =>
                  window.shellApi.openExternal("https://console.groq.com/keys") },
            ]);
          } else {
            setActions([
              { label: "Try again", primary: true, onClick: async (e) => {
                  e.target.textContent = "Checking…";
                  e.target.disabled = true;
                  await window.shellApi.retryLlm();
                } },
              { label: "Continue anyway", onClick: () => window.shellApi.continueAnyway() },
            ]);
          }
        } else if (s.phase === "error") {
          $("title").textContent = "EditcoRAG couldn’t start";
          $("detail").textContent = s.detail || "Something went wrong.";
          setActions([
            { label: "Show details", onClick: async () => {
                $("logs").textContent = await window.shellApi.getLogs();
                show($("logs"), true);
              } },
          ]);
        }
      });
    </script>
  </body>
