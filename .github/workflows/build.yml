name: Build desktop apps

# Windows is the reason this exists. The bundled Python interpreter is
# platform-specific, so a Windows installer cannot be produced from macOS -
# it has to be built on Windows, and a hosted runner is the free way to do it.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q
        env:
          # Tests must not depend on a key; anything that needs one is skipped.
          GROQ_API_KEY: ""

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon runner -> arm64 bundle
            target: dist:mac
            artifact: macos-arm64
          - os: windows-latest
            target: dist:win
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # The bundler copies whichever runtime uv resolves, so pin it explicitly
      # rather than inheriting whatever the runner image happens to ship.
      - run: uv python install 3.12

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the web UI
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # working-directory, not `npm --prefix`: on Windows the prefix flag still
      # resolves package.json from the current directory and fails with ENOENT.
      - name: Build the desktop app
        working-directory: desktop
        run: |
          npm install
          npm run ${{ matrix.target }}

      # A green build only proves the installer was produced. This starts the
      # bundled engine and waits for it to serve, which is what actually
      # catches a runtime that cannot resolve its own stdlib or a native wheel
      # that is missing on this platform - neither of which is visible until
      # someone launches the app.
      - name: Smoke-test the bundled engine
        shell: bash
        working-directory: desktop
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            PY="resources/python/python.exe"
          else
            PY="resources/python/bin/python3"
          fi
          export PYTHONHOME="$PWD/resources/python"
          export LOCALRAG_DATA_DIR="$PWD/smoke-data"
          export LOCALRAG_WEB_DIST="$PWD/resources/app/web/dist"
          "$PY" -m server.cli serve --port 0 > smoke.log 2>&1 &
          for _ in $(seq 1 120); do
            grep -q LOCALRAG_READY smoke.log && break
            sleep 2
          done
          grep -q LOCALRAG_READY smoke.log || { echo "engine never started:"; cat smoke.log; exit 1; }
          PORT=$(grep -o 'LOCALRAG_READY {.*}' smoke.log | head -1 | sed 's/.*"port": *\([0-9]*\).*/\1/')
          echo "engine announced port $PORT"
          for _ in $(seq 1 60); do
            curl -sf "http://127.0.0.1:$PORT/api/health" -o health.json && break
            sleep 2
          done
          test -s health.json || { echo "never became reachable:"; cat smoke.log; exit 1; }
          cat health.json
          grep -q '"ok": *true' health.json || { echo "health did not report ok"; exit 1; }
          curl -sf "http://127.0.0.1:$PORT/" | grep -q 'id="root"' \
            || { echo "the bundled UI was not served"; exit 1; }
          echo "engine starts, serves the API and the UI on $RUNNER_OS"

      - uses: actions/upload-artifact@v4
        with:
          name: editcorag-${{ matrix.artifact }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.dmg
            desktop/release/*.exe
